<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Pharmacy Management</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link href="https://unpkg.com/boxicons@2.1.4/css/boxicons.min.css" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">

            <div class="auth-brand">
                <div class="auth-logo-ring">
                    <i class='bx bx-plus-medical'></i>
                </div>
                <h2>Pharmacy MS</h2>
            </div>

            <p class="auth-subtitle">Welcome back! Please log in to your account.</p>

            {% with messages = get_flashed_messages(with_categories=true) %}
                {% if messages %}
                    {% for category, message in messages %}
                        <div class="alert alert-{{ category }}">
                            <i class='bx bx-error-circle'></i> {{ message }}
                        </div>
                    {% endfor %}
                {% endif %}
            {% endwith %}

            <form method="POST" action="{{ url_for('login') }}">
                <div class="form-group">
                    <label for="username" class="form-label">Username</label>
                    <div class="input-wrapper">
                        <i class='bx bx-user input-icon'></i>
                        <input type="text" id="username" name="username" class="form-control" placeholder="Enter your username" required>
                    </div>
                </div>
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="input-wrapper">
                        <i class='bx bx-lock-alt input-icon'></i>
                        <input type="password" id="password" name="password" class="form-control" placeholder="Enter your password" required>
                    </div>
                </div>
                <button type="submit" class="action-btn primary auth-submit-btn">
                    <i class='bx bx-log-in'></i> Login
                </button>
            </form>

            <div class="auth-switch">
                <small>Don't have an account?
                    <a href="{{ url_for('demo_login') }}" class="btn btn-secondary">Try Demo</a>
                    <a href="{{ url_for('register') }}">Register here</a>
                </small>
            </div>
        </div>
    </div>
</body>
</html>
